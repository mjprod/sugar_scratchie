name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sugar
          POSTGRES_PASSWORD: sugar
          POSTGRES_DB: sugar_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sugar -d sugar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://sugar:sugar@127.0.0.1:5433/sugar_test
      DASHBOARD_TOKEN: test-dashboard-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run API tests
        run: npm run test:api
