services:
  postgres:
    image: postgres:16-alpine
    container_name: sugar-scratchie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sugar
      POSTGRES_PASSWORD: sugar
      POSTGRES_DB: sugar
    ports:
      - "5433:5432"
    volumes:
      - sugar_scratchie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugar -d sugar"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sugar-scratchie-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sugar.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sugar_scratchie_pg:
