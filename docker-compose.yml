services:
  postgres:
    image: postgres:16-alpine
    container_name: sugar-scratchie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sugar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sugar}
      POSTGRES_DB: ${POSTGRES_DB:-sugar}
    ports:
      - "5433:5432"
    volumes:
      - sugar_scratchie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugar -d sugar"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: sugar-scratchie-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      # n8n 2 hides Execute Command unless this is an empty list. The After Effects
      # workflow uses that node to copy a job folder and launch After Effects.
      NODES_EXCLUDE: "[]"
    extra_hosts:
      # Let n8n call the API on the host (progress lines and /progress/run).
      # 127.0.0.1 inside this container is n8n, not the API.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./n8n-data:/home/node/.n8n

volumes:
  sugar_scratchie_pg:
