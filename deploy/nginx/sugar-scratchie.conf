# Replace YOUR_DOMAIN with your hostname, e.g. scratchie.example.com
#
# If the player app (frontend-new) is served from another host, give its
# /assets/ and /wasm/ the same immutable headers and index.html no-cache.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /opt/sugar-scratchie/dist;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite output is content-hashed.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Runtime wasm filenames carry the package version.
    location ^~ /wasm/ {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Catalog indexes and meshes can be rewritten in place under the same name.
    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Card/model media; the API appends ?v=<mtime> so replacements bust the cache.
    location ~* ^/(cards|models|themes|photo-scratch|flags|scratch|sounds|cursor-fx|lotties)/.+\.(webp|png|jpe?g|gif|svg|mp4|webm|mp3|wav|ogg|lottie)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
