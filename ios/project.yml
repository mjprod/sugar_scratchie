name: SugarScratchie
options:
  bundleIdPrefix: com.sugarscratchie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
targets:
  SugarScratchie:
    type: application
    platform: iOS
    sources:
      - path: SugarScratchie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarscratchie.smoke
        PRODUCT_NAME: SugarScratchie
        INFOPLIST_FILE: SugarScratchie/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LAN_HOST: "$(LAN_HOST)"
        REMOTE_API_BASE_URL: "$(REMOTE_API_BASE_URL)"
        REMOTE_MEDIA_BASE_URL: "$(REMOTE_MEDIA_BASE_URL)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_PREPROCESS: NO
        OTHER_SWIFT_FLAGS: ""
    dependencies:
      - package: Lottie
        product: Lottie
    preBuildScripts:
      - name: Resolve Dev Endpoints
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ENV_FILE="${SRCROOT}/../frontend-new/.env"
          LAN="$(ipconfig getifaddr en0 2>/dev/null || true)"
          if [[ ! "$LAN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            LAN="127.0.0.1"
          fi
          API="https://sugarbackend.mxjprod.work"
          MEDIA="https://sugarbackend.mxjprod.work"
          if [[ -f "$ENV_FILE" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              case "$line" in
                VITE_API_PROXY=*) API="${line#VITE_API_PROXY=}" ;;
                VITE_MEDIA_PROXY=*) MEDIA="${line#VITE_MEDIA_PROXY=}" ;;
              esac
            done < "$ENV_FILE"
          fi
          API="$(echo "$API" | tr -d '"' | tr -d "'" | xargs)"
          MEDIA="$(echo "$MEDIA" | tr -d '"' | tr -d "'" | xargs)"
          OUT="${SRCROOT}/SugarScratchie/Generated/DevConfig.generated.swift"
          mkdir -p "$(dirname "$OUT")"
          cat > "$OUT" <<EOF
          enum DevConfigGenerated {
            static let lanHost = "${LAN}"
            static let remoteApiBaseURL = "${API}"
            static let remoteMediaBaseURL = "${MEDIA}"
          }
          EOF
scheme:
  SugarScratchie:
    build:
      targets:
        SugarScratchie: all
    run:
      config: Debug
